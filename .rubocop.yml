AllCops:
  NewCops: enable

Gemspec/RequireMFA:
  Enabled: false

Lint/ParenthesesAsGroupedExpression:
  Enabled: true
  Exclude:
    - "spec/**/*"

Gemspec/RequiredRubyVersion:
  Enabled: false

Metrics/ModuleLength:
  Exclude:
    - "**/*_spec.rb"

Metrics/BlockLength:
  Exclude:
    - "**/*_spec.rb"

Style/BlockDelimiters:
  Enabled: true
  Exclude:
    - "spec/**/*"

Style/Documentation:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundModuleBody:
  Enabled: false

Style/GuardClause:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Style/SignalException:
  Enabled: false

Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# Offense count: 9
Metrics/AbcSize:
  Enabled: false

# Offense count: 1
# Configuration parameters: CountComments.
Metrics/ClassLength:
  Enabled: false

# Offense count: 2
Metrics/CyclomaticComplexity:
  Enabled: false

# Offense count: 79
# Configuration parameters: AllowURI, URISchemes.
Layout/LineLength:
  Enabled: false

# Offense count: 10
# Configuration parameters: CountComments.
Metrics/MethodLength:
  Enabled: false

# Offense count: 2
Metrics/PerceivedComplexity:
  Enabled: false
