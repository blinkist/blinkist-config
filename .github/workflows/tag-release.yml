name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish gem & release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          ver="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' lib/blinkist/config/version.rb | head -1)"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check whether tag exists
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.v.outputs.tag }} already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.exists.outputs.exists == 'false'
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Push gem to rubygems.org
        if: steps.exists.outputs.exists == 'false'
        uses: rubygems/release-gem@v1

      - name: Create GitHub release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes
