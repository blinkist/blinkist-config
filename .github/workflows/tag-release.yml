name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          ver="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' lib/blinkist/config/version.rb | head -1)"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check whether tag exists
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.v.outputs.tag }} already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag & release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes
